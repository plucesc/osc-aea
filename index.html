        .filter-panel {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            width: min(360px, calc(100% - 28px));
            padding: 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            font-family: Arial, Helvetica, sans-serif;
        }
        .filter-panel h1 {
            margin: 0 0 10px;
            font-size: 17px;
            line-height: 1.2;
        }
        .filter-panel label {
            display: block;
            margin-top: 9px;
            margin-bottom: 4px;
            color: #444;
            font-size: 12px;
            font-weight: 700;
        }
        .filter-panel select,
        .filter-panel button {
            width: 100%;
            min-height: 34px;
            border-radius: 6px;
            border: 1px solid #b8b8b8;
            background: #fff;
            color: #222;
            font-size: 13px;
        }
        .filter-panel button {
            margin-top: 10px;
            background: #0b63b6;
            color: #fff;
            border-color: #0b63b6;
            cursor: pointer;
            font-weight: 700;
        }
        .filter-count {
            margin-top: 10px;
            color: #555;
            font-size: 12px;

        <title>Mapa OSC</title>

    <body>
        <div class="filter-panel" id="filterPanel">
            <h1>Mapa OSC</h1>
            <label for="filterTipo">Tipo de institución</label>
            <select id="filterTipo">
                <option value="">Todas</option>
            </select>
            <label for="filterComuna">Comuna</label>
            <select id="filterComuna">
                <option value="">Todas</option>
            </select>
            <label for="filterPrograma">Programa / Apoyo recibido</label>
            <select id="filterPrograma">
                <option value="">Todos</option>
            </select>
            <button type="button" id="resetFilters">Limpiar filtros</button>
            <div class="filter-count" id="filterCount"></div>
        </div>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/osc_direcciones_geocodificadas_qgis_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-34.682916970279706,-58.54637271853147],[-34.53515047027972,-58.32391106468533]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);
        function pop_osc_direcciones_geocodificadas_qgis_1(feature, layer) {
            var props = feature.properties || {};
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Institución</th>\
                        <td class="visible-with-data" id="nombre">' + (props['nombre'] ? autolinker.link(String(props['nombre']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Tipo de institución</th>\
                        <td class="visible-with-data" id="tipo">' + (props['tipo'] ? autolinker.link(String(props['tipo']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Programa</th>\
                        <td class="visible-with-data" id="programa">' + (props['programa'] ? autolinker.link(String(props['programa']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_osc_direcciones_geocodificadas_qgis_1_0() {
            return {
                pane: 'pane_osc_direcciones_geocodificadas_qgis_1',
                radius: 7.0,
                opacity: 1,
                color: 'rgba(6,75,141,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(11,99,182,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_osc_direcciones_geocodificadas_qgis_1');
        map.getPane('pane_osc_direcciones_geocodificadas_qgis_1').style.zIndex = 401;
        map.getPane('pane_osc_direcciones_geocodificadas_qgis_1').style['mix-blend-mode'] = 'normal';
        var layer_osc_direcciones_geocodificadas_qgis_1 = new L.geoJson(json_osc_direcciones_geocodificadas_qgis_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_osc_direcciones_geocodificadas_qgis_1',
            layerName: 'layer_osc_direcciones_geocodificadas_qgis_1',
            pane: 'pane_osc_direcciones_geocodificadas_qgis_1',
            onEachFeature: pop_osc_direcciones_geocodificadas_qgis_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_osc_direcciones_geocodificadas_qgis_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_osc_direcciones_geocodificadas_qgis_1);
        map.addLayer(layer_osc_direcciones_geocodificadas_qgis_1);
        var allOscFeatures = json_osc_direcciones_geocodificadas_qgis_1.features.slice();
        function sortValues(values) {
            return Array.from(values).filter(Boolean).sort(function(a, b) {
                return String(a).localeCompare(String(b), 'es', {numeric: true});
            });
        }
        function fillSelect(id, values) {
            var select = document.getElementById(id);
            var first = select.options[0].outerHTML;
            select.innerHTML = first;
            values.forEach(function(value) {
                var option = document.createElement('option');
                option.value = value;
                option.textContent = id === 'filterComuna' ? 'Comuna ' + value : value;
                select.appendChild(option);
            });
        }
        function featureMatches(feature) {
            var props = feature.properties || {};
            var tipo = document.getElementById('filterTipo').value;
            var comuna = document.getElementById('filterComuna').value;
            var programa = document.getElementById('filterPrograma').value;
            var programas = Array.isArray(props.programas) ? props.programas : [];
            return (!tipo || props.tipo === tipo)
                && (!comuna || props.comuna === comuna)
                && (!programa || programas.indexOf(programa) !== -1 || props.programa === programa);
        }
        function applyFilters() {
            var filtered = allOscFeatures.filter(featureMatches);
            layer_osc_direcciones_geocodificadas_qgis_1.clearLayers();
            layer_osc_direcciones_geocodificadas_qgis_1.addData(filtered);
            document.getElementById('filterCount').textContent = filtered.length + ' de ' + allOscFeatures.length + ' puntos visibles';
            if (filtered.length) {
                var bounds = layer_osc_direcciones_geocodificadas_qgis_1.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, {padding: [20, 20], maxZoom: 15});
                }
            }
        }
        fillSelect('filterTipo', sortValues(new Set(allOscFeatures.map(function(feature) {
            return (feature.properties || {}).tipo;
        }))));
        fillSelect('filterComuna', sortValues(new Set(allOscFeatures.map(function(feature) {
            return (feature.properties || {}).comuna;
        }))));
        var programSet = new Set();
        allOscFeatures.forEach(function(feature) {
            var programas = (feature.properties || {}).programas || [];
            programas.forEach(function(programa) { programSet.add(programa); });
        });
        fillSelect('filterPrograma', sortValues(programSet));
        document.getElementById('filterTipo').addEventListener('change', applyFilters);
        document.getElementById('filterComuna').addEventListener('change', applyFilters);
        document.getElementById('filterPrograma').addEventListener('change', applyFilters);
        document.getElementById('resetFilters').addEventListener('click', function() {
            document.getElementById('filterTipo').value = '';
            document.getElementById('filterComuna').value = '';
            document.getElementById('filterPrograma').value = '';
            applyFilters();
        });
        L.DomEvent.disableClickPropagation(document.getElementById('filterPanel'));
        applyFilters();
        setBounds();
        </script>
