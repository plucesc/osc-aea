<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .map-panel {
            position: absolute;
            z-index: 1000;
            width: min(336px, calc(100% - 28px));
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #d7e1ef;
            box-shadow: 0 8px 24px rgba(25, 40, 68, 0.16);
            font-family: Arial, Helvetica, sans-serif;
            color: #192844;
        }
        .filter-panel { top: 8px; right: 8px; max-height: 55vh; overflow: auto; }
        .summary-panel { right: 8px; bottom: 8px; max-height: 36vh; overflow: auto; }
        .map-panel h2 { margin: 0 0 8px; color: #052b76; font-size: 15px; font-weight: 800; line-height: 1.2; }
        .filter-panel h2, .summary-panel h2 { padding-bottom: 8px; border-bottom: 1px solid #dfe7f2; }
        .filter-section { margin-top: 7px; border-top: 1px solid #e3e9f4; }
        .filter-section summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; cursor: pointer; list-style: none; }
        .filter-section summary::-webkit-details-marker { display: none; }
        .filter-section summary::after { content: "▾"; color: #7b8798; font-size: 12px; }
        .filter-section[open] summary::after { content: "▴"; }
        .filter-section-title { color: #25314d; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
        .selected-count { color: #52627b; font-size: 11px; font-weight: 700; text-transform: none; white-space: nowrap; }
        .checkbox-list { display: grid; gap: 4px; max-height: 92px; overflow: auto; padding: 5px 4px 1px 0; }
        .checkbox-row { display: grid; grid-template-columns: 15px minmax(0, 1fr); gap: 7px; align-items: start; color: #192844; font-size: 11px; line-height: 1.22; }
        .checkbox-row input { width: 13px; height: 13px; margin: 1px 0 0; accent-color: #0b63b6; }
        .panel-button { width: 100%; min-height: 32px; margin-top: 8px; border-radius: 6px; border: 1px solid #0b63b6; background: #0b63b6; color: #fff; cursor: pointer; font-size: 12px; font-weight: 800; }
        .panel-button.secondary { border-color: #edf0f5; background: #f2f4f8; color: #333; }
        .filter-badge { display: inline-block; margin-top: 10px; padding: 4px 10px; border: 1px solid #c8dcff; border-radius: 999px; background: #eef5ff; color: #17438b; font-size: 11px; font-weight: 700; }
        .filter-count { margin-top: 8px; color: #50617f; font-size: 12px; }
        .metric-card { margin-top: 8px; padding: 9px; border: 1px solid #d9e3f1; border-radius: 7px; background: #f8fbff; }
        .metric-label { display: block; color: #52627b; font-size: 11px; line-height: 1.25; }
        .metric-value { display: block; margin-top: 3px; color: #052b76; font-size: 16px; font-weight: 800; line-height: 1.15; }
        .type-summary table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .type-summary th, .type-summary td { padding: 4px 0; border-top: 1px solid #e8edf6; text-align: left; vertical-align: middle; }
        .type-summary th { color: #25314d; font-weight: 800; }
        .type-summary td { color: #192844; }
        .type-summary th:last-child, .type-summary td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; color: #052b76; }
        .bar-cell { width: 35%; padding-left: 8px !important; padding-right: 8px !important; }
        .summary-bar-track { height: 8px; border-radius: 999px; background: #e8eef7; overflow: hidden; }
        .summary-bar { height: 100%; border-radius: 999px; background: #0d2366; }
        .osc-popup { min-width: 250px; max-width: 330px; color: #192844; font-family: Arial, Helvetica, sans-serif; }
        .osc-popup-title { margin: 0 0 6px; color: #052b76; font-size: 16px; font-weight: 700; line-height: 1.2; }
        .osc-popup-subtitle { margin: 0 0 10px; color: #50617f; font-size: 12px; line-height: 1.35; }
        .osc-popup-badge { display: inline-block; margin-bottom: 9px; padding: 4px 10px; border: 1px solid #c8dcff; border-radius: 999px; background: #eef5ff; color: #17438b; font-size: 11px; font-weight: 700; }
        .osc-popup-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid #e8edf6; font-size: 12px; line-height: 1.3; }
        .osc-popup-row strong { color: #25314d; font-weight: 700; }
        .osc-popup-row span { color: #192844; }
        @media (max-width: 900px) { .filter-panel, .summary-panel { left: auto; right: 10px; width: min(330px, calc(100% - 20px)); } .filter-panel { top: 10px; max-height: 54vh; } .summary-panel { bottom: 10px; max-height: 34vh; } }
        </style>
        <title>Mapa OSC</title>
    </head>
    <body>
        <div class="map-panel filter-panel" id="filterPanel">
            <h2>Consulta de datos</h2>
            <details class="filter-section" open>
                <summary><span class="filter-section-title">Tipo de instituci&oacute;n</span><span class="selected-count" id="filterTipoCount">Todas</span></summary>
                <div class="checkbox-list" id="filterTipo"></div>
            </details>
            <details class="filter-section" open>
                <summary><span class="filter-section-title">Comuna</span><span class="selected-count" id="filterComunaCount">Todas</span></summary>
                <div class="checkbox-list" id="filterComuna"></div>
            </details>
            <details class="filter-section" open>
                <summary><span class="filter-section-title">Programa / Apoyo recibido</span><span class="selected-count" id="filterProgramaCount">Todos</span></summary>
                <div class="checkbox-list" id="filterPrograma"></div>
            </details>
            <button type="button" class="panel-button" id="applyFiltersButton">Aplicar filtros</button>
            <button type="button" class="panel-button secondary" id="resetFilters">Limpiar filtros</button>
            <span class="filter-badge" id="filterBadge">Sin filtros activos</span>
            <div class="filter-count" id="filterCount"></div>
        </div>
        <div class="map-panel summary-panel" id="summaryPanel">
            <div class="type-summary"><h2>Total por tipo de instituci&oacute;n</h2><table><thead><tr><th>Tipo</th><th class="bar-cell"></th><th>Total</th></tr></thead><tbody id="typeSummaryBody"></tbody></table></div>
        </div>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/osc_direcciones_geocodificadas_qgis_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-34.67376459965034,-58.55615246940562],[-34.52599809965035,-58.33369081555948]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);
        function pop_osc_direcciones_geocodificadas_qgis_1(feature, layer) {
            var props = feature.properties || {};
            var popupContent = '<div class="osc-popup">\
                    <h2 class="osc-popup-title">' + (props['nombre'] ? autolinker.link(String(props['nombre']).replace(/'/g, '\'').toLocaleString()) : 'Sin nombre') + '</h2>\
                    <p class="osc-popup-subtitle">' + (props['tipo'] ? autolinker.link(String(props['tipo']).replace(/'/g, '\'').toLocaleString()) : 'Sin tipo informado') + '</p>\
                    <span class="osc-popup-badge">Comuna ' + (props['comuna'] ? autolinker.link(String(props['comuna']).replace(/'/g, '\'').toLocaleString()) : 's/d') + '</span>\
                    <div class="osc-popup-row"><strong>Tipo</strong><span>' + (props['tipo'] ? autolinker.link(String(props['tipo']).replace(/'/g, '\'').toLocaleString()) : 'Sin dato') + '</span></div>\
                    <div class="osc-popup-row"><strong>Programa</strong><span>' + (props['programa'] ? autolinker.link(String(props['programa']).replace(/'/g, '\'').toLocaleString()) : 'Sin dato') + '</span></div>\
                </div>';
            var content = popupContent;
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_osc_direcciones_geocodificadas_qgis_1_0() {
            return {
                pane: 'pane_osc_direcciones_geocodificadas_qgis_1',
                radius: 7.0,
                opacity: 1,
                color: 'rgba(6,75,141,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(38,101,143,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_osc_direcciones_geocodificadas_qgis_1');
        map.getPane('pane_osc_direcciones_geocodificadas_qgis_1').style.zIndex = 401;
        map.getPane('pane_osc_direcciones_geocodificadas_qgis_1').style['mix-blend-mode'] = 'normal';
        var layer_osc_direcciones_geocodificadas_qgis_1 = new L.geoJson(json_osc_direcciones_geocodificadas_qgis_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_osc_direcciones_geocodificadas_qgis_1',
            layerName: 'layer_osc_direcciones_geocodificadas_qgis_1',
            pane: 'pane_osc_direcciones_geocodificadas_qgis_1',
            onEachFeature: pop_osc_direcciones_geocodificadas_qgis_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_osc_direcciones_geocodificadas_qgis_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_osc_direcciones_geocodificadas_qgis_1);
        map.addLayer(layer_osc_direcciones_geocodificadas_qgis_1);
        var allOscFeatures = json_osc_direcciones_geocodificadas_qgis_1.features.slice();
        function sortValues(values) { return Array.from(values).filter(Boolean).sort(function(a, b) { return String(a).localeCompare(String(b), 'es', {numeric: true}); }); }
        function renderCheckboxes(id, values, labelFormatter) {
            var container = document.getElementById(id); container.innerHTML = '';
            values.forEach(function(value) {
                var label = document.createElement('label'); label.className = 'checkbox-row';
                var input = document.createElement('input'); input.type = 'checkbox'; input.value = value;
                var span = document.createElement('span'); span.textContent = labelFormatter ? labelFormatter(value) : value;
                label.appendChild(input); label.appendChild(span); container.appendChild(label);
            });
        }
        function selectedValues(id) { return Array.from(document.querySelectorAll('#' + id + ' input:checked')).map(function(input) { return input.value; }); }
        function featureMatches(feature) {
            var props = feature.properties || {}; var tipos = selectedValues('filterTipo'); var comunasFiltro = selectedValues('filterComuna'); var programasFiltro = selectedValues('filterPrograma');
            var programas = Array.isArray(props.programas) ? props.programas : []; var comunas = Array.isArray(props.comunas) ? props.comunas : [];
            return (!tipos.length || tipos.indexOf(props.tipo) !== -1)
                && (!comunasFiltro.length || comunasFiltro.some(function(comuna) { return comunas.indexOf(comuna) !== -1 || props.comuna === comuna; }))
                && (!programasFiltro.length || programasFiltro.some(function(programa) { return programas.indexOf(programa) !== -1 || props.programa === programa; }));
        }
        function renderTypeSummary(features) {
            var counts = {}; features.forEach(function(feature) { var tipo = (feature.properties || {}).tipo || 'Sin categor\\u00eda'; counts[tipo] = (counts[tipo] || 0) + 1; });
            var maxCount = Math.max.apply(null, Object.keys(counts).map(function(tipo) { return counts[tipo]; }).concat([1]));
            var rows = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a] || a.localeCompare(b, 'es', {numeric: true}); }).map(function(tipo) {
                var pct = Math.max(4, Math.round((counts[tipo] / maxCount) * 100));
                return '<tr><td>' + tipo + '</td><td class="bar-cell"><div class="summary-bar-track"><div class="summary-bar" style="width:' + pct + '%"></div></div></td><td>' + counts[tipo] + '</td></tr>';
            });
            document.getElementById('typeSummaryBody').innerHTML = rows.length ? rows.join('') : '<tr><td colspan="3">Sin resultados</td></tr>';
        }
        function updateSectionCounts() {
            var tipoCount = selectedValues('filterTipo').length;
            var comunaCount = selectedValues('filterComuna').length;
            var programaCount = selectedValues('filterPrograma').length;
            document.getElementById('filterTipoCount').textContent = tipoCount ? tipoCount + ' seleccionadas' : 'Todas';
            document.getElementById('filterComunaCount').textContent = comunaCount ? comunaCount + ' seleccionadas' : 'Todas';
            document.getElementById('filterProgramaCount').textContent = programaCount ? programaCount + ' seleccionados' : 'Todos';
        }
        function updateFilterBadge() { var totalSelected = selectedValues('filterTipo').length + selectedValues('filterComuna').length + selectedValues('filterPrograma').length; document.getElementById('filterBadge').textContent = totalSelected ? totalSelected + ' filtros activos' : 'Sin filtros activos'; updateSectionCounts(); }
        function applyFilters() {
            var filtered = allOscFeatures.filter(featureMatches); layer_osc_direcciones_geocodificadas_qgis_1.clearLayers(); layer_osc_direcciones_geocodificadas_qgis_1.addData(filtered);
            document.getElementById('filterCount').textContent = filtered.length + ' de ' + allOscFeatures.length + ' puntos visibles'; updateFilterBadge(); renderTypeSummary(filtered);
            if (filtered.length) { var bounds = layer_osc_direcciones_geocodificadas_qgis_1.getBounds(); if (bounds.isValid()) { map.fitBounds(bounds, {padding: [20, 20], maxZoom: 15}); } }
        }
        renderCheckboxes('filterTipo', sortValues(new Set(allOscFeatures.map(function(feature) { return (feature.properties || {}).tipo; }))));
        renderCheckboxes('filterComuna', sortValues(new Set(allOscFeatures.map(function(feature) { return ((feature.properties || {}).comunas || []); }).flat())), function(value) { return 'Comuna ' + value; });
        var programSet = new Set(); allOscFeatures.forEach(function(feature) { var programas = (feature.properties || {}).programas || []; programas.forEach(function(programa) { programSet.add(programa); }); });
        renderCheckboxes('filterPrograma', sortValues(programSet));
        document.getElementById('applyFiltersButton').addEventListener('click', applyFilters);
        Array.from(document.querySelectorAll('#filterPanel input[type="checkbox"]')).forEach(function(input) { input.addEventListener('change', updateSectionCounts); });
        document.getElementById('resetFilters').addEventListener('click', function() { Array.from(document.querySelectorAll('#filterPanel input[type="checkbox"]')).forEach(function(input) { input.checked = false; }); applyFilters(); });
        L.DomEvent.disableClickPropagation(document.getElementById('filterPanel')); L.DomEvent.disableScrollPropagation(document.getElementById('filterPanel'));
        L.DomEvent.disableClickPropagation(document.getElementById('summaryPanel')); L.DomEvent.disableScrollPropagation(document.getElementById('summaryPanel'));
        applyFilters();
        setBounds();
        </script>
    </body>
</html>
